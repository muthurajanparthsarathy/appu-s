# Appu's Mart — its own server block. Replace shop.example.com with the real (sub)domain.
# Install:  sudo cp deploy/nginx-appus-mart.conf /etc/nginx/sites-available/appus-mart
#           sudo ln -s /etc/nginx/sites-available/appus-mart /etc/nginx/sites-enabled/appus-mart
#           sudo nginx -t && sudo systemctl reload nginx      # reload keeps other sites running
#           sudo certbot --nginx -d shop.example.com            # HTTPS (session cookies require it)
server {
    listen 80;
    server_name shop.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends the real client address; the app reads the right-most hop (TRUSTED_PROXY_COUNT=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
